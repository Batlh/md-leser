// Googles Spiegel von Maven Central als Ausweichquelle hinter Maven Central.
// Maven Central scheitert auf den Build-Rechnern manchmal mit 504; der Spiegel
// hat dafür nicht immer die neuesten Pakete. Darum beides, Central zuerst.
def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
def addFallback = { repos ->
    repos.whenObjectAdded { repo ->
        if (repo instanceof MavenArtifactRepository) {
            def u = repo.url.toString()
            if ((u.contains('repo.maven.apache.org') || u.contains('repo1.maven.org')) &&
                    repos.findByName('centralSpiegel') == null) {
                repos.maven { name = 'centralSpiegel'; url = mirror }
            }
        }
    }
}
beforeSettings { settings ->
    addFallback(settings.pluginManagement.repositories)
    addFallback(settings.dependencyResolutionManagement.repositories)
}
